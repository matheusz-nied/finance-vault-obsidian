name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Build plugin
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module --eval
          "import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (version !== process.env.RELEASE_TAG) throw new Error('Release tag must match manifest version.');"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('manifest.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const notes = changelog.split(`## ${version}\n`)[1]?.split('\n## ')[0];
          if (!notes?.trim()) throw new Error('Missing release notes.');
          writeFileSync('release-notes.md', `## ${version}\n${notes}`);
          NODE
          gh release create "$tag" --title="$tag" --draft --notes-file release-notes.md main.js manifest.json styles.css
      - name: Verify attached files and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir release-check
          gh release download "$tag" --dir release-check
          test "$(find release-check -type f | wc -l)" -eq 3
          cmp main.js release-check/main.js
          cmp manifest.json release-check/manifest.json
          cmp styles.css release-check/styles.css
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json isDraft,url,assets
